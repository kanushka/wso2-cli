name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      sdk: ${{ steps.changes.outputs.sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected modules
        id: changes
        uses: ./.github/actions/go-changes

  quality:
    name: Static Checks
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      - name: Check shell formatting and vet
        if: needs.changes.outputs.shell == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go' ':!sdk/**' ':!examples/reference-module/**')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following shell files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go vet ./...

      - name: Check SDK formatting, module hygiene, and vet
        if: needs.changes.outputs.sdk == 'true'
        shell: bash
        working-directory: sdk
        env:
          GOWORK: off
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following SDK files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go mod tidy -diff
          go vet ./...

      - name: Check reference-module formatting and vet
        # The reference module proves the public SDK from a module author's
        # side, so it is held to the same standard whenever the shell or the
        # module changes. Its tests run in the acceptance gate below.
        if: needs.changes.outputs.shell == 'true'
        working-directory: examples/reference-module
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following reference-module files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go vet ./...

      - name: Lint shell
        if: needs.changes.outputs.shell == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Lint SDK
        if: needs.changes.outputs.sdk == 'true'
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.12
          working-directory: sdk

  acceptance:
    name: Architecture Proof
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      # The gate is one script rather than a list of steps here, so the run a
      # contributor can reproduce locally is the same run that decides a pull
      # request. It builds all three modules and runs every test layer
      # regardless of which one changed: the proof is an end-to-end claim, and
      # an SDK-only change is exactly the kind that breaks the shell.
      - name: Run the architecture-proof acceptance gate
        run: ./scripts/acceptance.sh
