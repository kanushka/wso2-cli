name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      sdk: ${{ steps.changes.outputs.sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected modules
        id: changes
        uses: ./.github/actions/go-changes

  quality:
    name: Static Checks
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      - name: Check shell formatting and vet
        if: needs.changes.outputs.shell == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go' ':!sdk/**' ':!modules/reference/**')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following shell files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go vet ./...

      - name: Check SDK formatting, module hygiene, and vet
        if: needs.changes.outputs.sdk == 'true'
        shell: bash
        working-directory: sdk
        env:
          GOWORK: off
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following SDK files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go mod tidy -diff
          go vet ./...

      - name: Check reference-module formatting and vet
        # The reference module proves the public SDK from a module author's
        # side, so it is held to the same standard whenever the shell or the
        # module changes. Its tests run in the acceptance gate below.
        if: needs.changes.outputs.shell == 'true'
        working-directory: modules/reference
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following reference-module files require gofmt:"
            echo "$unformatted"
            exit 1
          fi

          go vet ./...

      - name: Cross-build the shell for every supported platform
        # The gate below runs on Linux only, so a file behind a build tag for
        # another platform is never compiled by it. The session lock is the
        # first such seam, and a Windows-only file that stops compiling would
        # otherwise reach a release unnoticed.
        #
        # This list is every target .goreleaser.yaml releases, and the two must
        # stay equal: a target that is released without being compiled here can
        # break in a tag rather than in the pull request that broke it.
        if: needs.changes.outputs.shell == 'true'
        shell: bash
        # ARMv6 is the variant the release builds, and Go defaults to ARMv7. The
        # check compiles what ships rather than a variant nobody receives; the
        # setting is inert for every other target in the list.
        env:
          GOARM: '6'
        run: |
          set -euo pipefail

          for target in linux/amd64 linux/arm64 linux/arm linux/386 \
            darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "Building for ${target}"
            GOOS="${target%%/*}" GOARCH="${target##*/}" go build ./...
            GOOS="${target%%/*}" GOARCH="${target##*/}" go vet ./...
          done

      - name: Lint shell
        if: needs.changes.outputs.shell == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Lint SDK
        if: needs.changes.outputs.sdk == 'true'
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: off
        with:
          version: v2.12
          working-directory: sdk

  # The Windows installer cannot be driven from the Linux gate: PowerShell, the
  # per-user environment variables it writes, and Expand-Archive only exist here.
  # This is the one place the single-seam goal cannot be met, and leaving the
  # platform untested is the worse option. The scenarios are the ones the Unix
  # runs cover, against the same fixture release.
  install-windows:
    name: Windows Installer
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      # Only the installer and its removal run. The rest of the acceptance suite is
      # a Linux gate by design, and running it here would be proving something else.
      - name: Drive the Windows installer
        run: go test ./test/acceptance/ -run 'TestInstallScript|TestUninstall' -count=1 -v

  acceptance:
    name: Architecture Proof
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      # The gate is one script rather than a list of steps here, so the run a
      # contributor can reproduce locally is the same run that decides a pull
      # request. It builds all three modules and runs every test layer
      # regardless of which one changed: the proof is an end-to-end claim, and
      # an SDK-only change is exactly the kind that breaks the shell.
      - name: Run the architecture-proof acceptance gate
        run: ./scripts/acceptance.sh

      - name: Prove the suite under an unclean TMPDIR
        run: |
          mkdir -p "${RUNNER_TEMP}/trailing"
          TMPDIR="${RUNNER_TEMP}/trailing//" go test ./internal/state/ -count=1

  previous-protocol:
    name: Previous Protocol
    needs: changes
    if: needs.changes.outputs.shell == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.mod
            sdk/go.mod

      # The gate above proves the branch against itself, which is the graph no
      # released module has. This one reproduces a released module's graph
      # instead — the workspace dropped and the SDK resolved by version from the
      # proxy — so a change that breaks the older half of the protocol window is
      # caught by whoever made it rather than by a user a release later.
      #
      # It is the one job that depends on the module proxy for something other
      # than dependencies, and it reports an unreachable proxy as a failure:
      # reading it as "nothing is published" would make a blip look like proof.
      - name: Prove the previous protocol
        run: ./scripts/previous-protocol.sh
